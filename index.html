<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>a little question 💛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --peach:#FFD9C0; --blush:#FF9EBB; --lav:#C3B1FF; --cream:#FFF8F1;
    --coral:#FF3D6E; --gold:#FFC233; --plum:#4E2746; --plum-soft:#7a4c6c;
    --shadow:rgba(120,40,80,.22);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:'Nunito',system-ui,-apple-system,sans-serif; color:var(--plum);
    min-height:100%; display:flex; align-items:center; justify-content:center;
    padding:24px; overflow:hidden;
    background:linear-gradient(130deg,var(--peach),var(--blush) 45%,var(--lav));
    background-size:220% 220%; animation:drift 16s ease-in-out infinite;
  }
  body.celebrate{ animation:drift 7s ease-in-out infinite; }
  @keyframes drift{ 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

  .hearts{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .heart{ position:absolute; bottom:-40px; font-size:1.6rem; opacity:0; animation:rise linear forwards; filter:drop-shadow(0 4px 6px rgba(120,40,80,.15)); }
  @keyframes rise{
    0%{ transform:translateY(0) rotate(0deg) scale(.7); opacity:0; }
    12%{ opacity:.85; }
    100%{ transform:translateY(-115vh) rotate(220deg) scale(1.1); opacity:0; }
  }

  .card{
    position:relative; z-index:2; width:min(540px,100%);
    background:var(--cream); border-radius:34px; padding:46px 38px 40px; text-align:center;
    box-shadow:0 2px 0 rgba(255,255,255,.7) inset,0 26px 60px -18px var(--shadow),0 8px 22px -12px var(--shadow);
    border:3px solid rgba(255,255,255,.75);
  }
  .card::after{ content:""; position:absolute; inset:12px; border:2px dashed rgba(255,158,187,.55); border-radius:24px; pointer-events:none; }

  .emoji-stack{ position:relative; width:160px; height:160px; margin:0 auto 6px; animation:bob 3.4s ease-in-out infinite; }
  .emoji-stack img{
    position:absolute; inset:0; width:160px; height:160px; object-fit:contain;
    transition:opacity .65s ease, filter .65s ease; filter:drop-shadow(0 14px 18px rgba(120,40,80,.28));
  }
  #creepyImg{ opacity:0; }
  .emoji{ width:160px; height:160px; object-fit:contain; margin:0 auto 6px; display:block; filter:drop-shadow(0 14px 18px rgba(120,40,80,.28)); }
  @keyframes bob{ 0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-12px) rotate(2deg)} }

  .eyebrow{ font-family:'Caveat',cursive; font-size:1.5rem; font-weight:700; color:var(--coral); transform:rotate(-3deg); margin-bottom:2px; }
  h1{ font-family:'Fredoka',sans-serif; font-weight:600; font-size:clamp(2rem,7vw,2.9rem); line-height:1.05; letter-spacing:-.5px; margin:6px 0 4px; }
  h1 .pop{ color:var(--coral); }

  #plea{ font-family:'Caveat',cursive; font-size:1.5rem; font-weight:600; color:var(--plum-soft); min-height:1.6em; margin:8px 0 26px; transition:opacity .2s ease; }

  .row{ display:flex; gap:18px; justify-content:center; align-items:center; flex-wrap:wrap; min-height:64px; }
  .btn{
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:1.25rem; border:none; cursor:pointer;
    padding:15px 34px; border-radius:18px; transform-origin:center;
    transform:scale(var(--s,1)) translateY(var(--ty,0));
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease, filter .18s ease;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation; will-change:transform;
  }
  .btn:focus-visible{ outline:3px solid var(--plum); outline-offset:3px; }
  #yes{ --s:1.08; color:#fff; background:linear-gradient(135deg,#FF5C86,var(--coral)); box-shadow:0 12px 22px -8px var(--coral),0 3px 0 rgba(180,30,70,.35); }
  #yes:hover{ --ty:-3px; filter:saturate(1.1) brightness(1.03); }
  #yes:active{ --ty:1px; }
  #no{ color:var(--plum-soft); background:#fff; box-shadow:0 8px 16px -10px var(--shadow), inset 0 0 0 2px rgba(122,76,108,.18); }
  #no.loose{ position:fixed; z-index:6; margin:0; transition:left .28s ease, top .28s ease, transform .18s cubic-bezier(.34,1.56,.64,1); }

  .footer{ margin-top:22px; font-family:'Caveat',cursive; font-size:1.2rem; color:var(--plum-soft); opacity:.85; }

  /* ---- win ---- */
  #win{ display:none; }
  #win.show{ display:block; animation:popIn .6s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popIn{ 0%{transform:scale(.7); opacity:0} 100%{transform:scale(1); opacity:1} }
  #win .emoji{ animation:cheer 1s cubic-bezier(.34,1.56,.64,1) both, bob 3s ease-in-out 1s infinite; }
  @keyframes cheer{ 0%{transform:scale(0) rotate(-25deg)} 60%{transform:scale(1.18) rotate(8deg)} 100%{transform:scale(1) rotate(0)} }
  #win h1{ font-size:clamp(2.1rem,7.5vw,3rem); }

  .win-sub{ font-family:'Caveat',cursive; font-size:1.6rem; color:var(--plum-soft); margin-top:10px; }
  .meet{ font-family:'Caveat',cursive; font-size:1.7rem; color:var(--plum); margin-top:16px; line-height:2; }
  .blank{
    font-family:'Caveat',cursive; font-size:1.55rem; font-weight:700; color:var(--coral); text-align:center;
    background:transparent; border:none; border-bottom:2.5px dashed var(--coral);
    width:130px; max-width:42vw; padding:0 4px 2px; margin:0 5px;
    -webkit-tap-highlight-color:transparent;
  }
  .blank::placeholder{ color:rgba(255,61,110,.4); font-weight:600; }
  .blank:focus{ outline:none; border-bottom-color:var(--plum); border-bottom-style:solid; }

  #fx{ position:fixed; inset:0; z-index:50; pointer-events:none; }

  @media (max-width:420px){
    .card{ padding:38px 22px 32px; border-radius:28px; }
    .emoji-stack, .emoji-stack img, .emoji{ width:132px; height:132px; }
    .btn{ font-size:1.15rem; padding:14px 28px; }
    .meet{ font-size:1.45rem; }
  }
  @media (prefers-reduced-motion:reduce){
    body, body.celebrate{ animation:none; background-position:30% 50%; }
    .emoji-stack, #win .emoji{ animation:none; }
    .heart{ display:none; }
    #no.loose{ transition:left .12s linear, top .12s linear; }
  }
</style>
</head>

<script>
(function(){
  "use strict";
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ambient hearts */
  const heartsLayer = document.getElementById('hearts');
  const heartChars = ['💛','💖','💗','💘','💕','✨','🩷'];
  function spawnHeart(){
    if (reduce) return;
    const h = document.createElement('span');
    h.className = 'heart';
    h.textContent = heartChars[Math.floor(Math.random()*heartChars.length)];
    h.style.left = Math.random()*100 + 'vw';
    h.style.fontSize = (0.9 + Math.random()*1.6) + 'rem';
    const dur = 7 + Math.random()*6;
    h.style.animationDuration = dur + 's';
    heartsLayer.appendChild(h);
    setTimeout(()=>h.remove(), dur*1000 + 200);
  }
  if (!reduce){ for (let i=0;i<6;i++) setTimeout(spawnHeart, i*350); setInterval(spawnHeart, 850); }

  /* elements */
  const noBtn    = document.getElementById('no');
  const yesBtn   = document.getElementById('yes');
  const plea     = document.getElementById('plea');
  const handsImg = document.getElementById('handsImg');
  const creepyImg= document.getElementById('creepyImg');
  let answered = false, attempts = 0, lastEscalate = 0;
  const FADE_FULL = 11;

  const noLabels = [
    "No","No?","no?!","wait—","think again","reconsider 🥺","pleeease","c'mon 🥹",
    "bahira movie jaam?","Momo?","Thukpa?","Samosa Chatt?",
    "i'll pay, promise 💸","catch me first 😤","you can't 😩","ok this is rigged",
    "But I am Batman 🦇","...still Batman 🦇","you can't escape Batman 🦇","I'm always watching 👁️"
  ];
  const pleas = [
    "the No button is shy, ignore it 👀",
    "take your time (the answer is yes)",
    "i'll literally buy you momos 🥟",
    "thukpa + a movie? 🍜",
    "samosa chatt is on me, promise 😋",
    "i made this whole page for you 🥹",
    "why is the No button so FAST 😩",
    "ok i'm slowly losing it 😬",
    "say yes before i go uncanny… 🫠",
    "...you do know i'm Batman, right 🦇",
    "Gotham can wait. you can't. 🦇",
    "fine. i'll wait here forever 🖤"
  ];

  /* runaway No button */
  function detach(){
    if (noBtn.classList.contains('loose')) return;
    const r = noBtn.getBoundingClientRect();
    noBtn.style.width = r.width + 'px';
    noBtn.style.left = r.left + 'px';
    noBtn.style.top  = r.top + 'px';
    noBtn.classList.add('loose');
  }
  function flee(px, py){
    detach();
    const pad = 14;
    const w = noBtn.offsetWidth, h = noBtn.offsetHeight;
    const maxX = Math.max(pad, window.innerWidth  - w - pad);
    const maxY = Math.max(pad, window.innerHeight - h - pad);
    let nx, ny;
    if (px == null){ nx = pad + Math.random()*(maxX-pad); ny = pad + Math.random()*(maxY-pad); }
    else {
      const r = noBtn.getBoundingClientRect();
      const cx = r.left + w/2, cy = r.top + h/2;
      let dx = cx - px, dy = cy - py;
      const dist = Math.hypot(dx, dy) || 1; dx/=dist; dy/=dist;
      const jump = 190 + Math.random()*130;
      nx = cx - w/2 + dx*jump; ny = cy - h/2 + dy*jump;
      if (nx<pad || nx>maxX || ny<pad || ny>maxY){ nx = pad + Math.random()*(maxX-pad); ny = pad + Math.random()*(maxY-pad); }
    }
    nx = Math.max(pad, Math.min(nx, maxX));
    ny = Math.max(pad, Math.min(ny, maxY));
    noBtn.style.left = nx + 'px';
    noBtn.style.top  = ny + 'px';
    noBtn.style.setProperty('--ty', (Math.random()*6-3) + 'px');
  }
  function escalate(){
    const now = Date.now();
    if (now - lastEscalate < 280) return;
    lastEscalate = now; attempts++;
    noBtn.textContent = noLabels[Math.min(attempts, noLabels.length-1)];
    plea.style.opacity = 0;
    setTimeout(()=>{ plea.textContent = pleas[Math.min(attempts-1, pleas.length-1)]; plea.style.opacity = 1; }, 130);
    yesBtn.style.setProperty('--s', Math.min(1.08 + attempts*0.10, 2.5).toFixed(2));
    noBtn.style.setProperty('--s', Math.max(1 - attempts*0.035, 0.55).toFixed(2));
    const p = Math.min(attempts / FADE_FULL, 1);
    handsImg.style.opacity  = (1 - p).toFixed(3);
    creepyImg.style.opacity = p.toFixed(3);
  }

  document.addEventListener('pointermove', function(e){
    if (answered || e.pointerType === 'touch') return;
    const r = noBtn.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    if (Math.hypot(cx - e.clientX, cy - e.clientY) < 95){ flee(e.clientX, e.clientY); escalate(); }
  }, {passive:true});
  noBtn.addEventListener('click', function(e){ e.preventDefault(); flee(); escalate(); });
  noBtn.addEventListener('mouseenter', function(e){ if(!answered){ flee(e.clientX, e.clientY); escalate(); } });
  noBtn.addEventListener('touchstart', function(e){ e.preventDefault(); flee(); escalate(); }, {passive:false});
  window.addEventListener('resize', function(){ if(noBtn.classList.contains('loose') && !answered) flee(); });

  /* YES → celebration */
  yesBtn.addEventListener('click', function(){
    if (answered) return;
    answered = true;
    document.body.classList.add('celebrate');
    noBtn.style.display = 'none';
    document.getElementById('ask').style.display = 'none';
    document.getElementById('win').classList.add('show');
    burst(); setTimeout(burst, 450); setTimeout(burst, 950);
    if (!reduce){ for(let i=0;i<14;i++) setTimeout(spawnHeart, i*120); }
    document.querySelectorAll('.blank').forEach(function(b){
      b.addEventListener('change', function(){ if(b.value.trim()) burst(); });
    });
  });

  /* confetti */
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  let parts = [], running = false;
  function size(){ canvas.width = innerWidth; canvas.height = innerHeight; }
  size(); window.addEventListener('resize', size);
  const colors = ['#FF3D6E','#FF9EBB','#FFC233','#C3B1FF','#FF5C86','#ffffff'];
  const emojis = ['💛','💖','✨','💕','💘'];
  function burst(){
    const n = reduce ? 30 : 90;
    const cx = innerWidth/2, cy = innerHeight*0.32;
    for (let i=0;i<n;i++){
      const ang = Math.random()*Math.PI*2, spd = 4 + Math.random()*9;
      const useEmoji = Math.random() < 0.4;
      parts.push({
        x:cx, y:cy, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd - 4,
        g:0.18 + Math.random()*0.12, rot:Math.random()*6.28, vr:(Math.random()-0.5)*0.3,
        size: useEmoji ? 16+Math.random()*14 : 7+Math.random()*7,
        color: colors[Math.floor(Math.random()*colors.length)],
        emoji: useEmoji ? emojis[Math.floor(Math.random()*emojis.length)] : null,
        life:1, decay:0.006 + Math.random()*0.006
      });
    }
    if (!running){ running = true; requestAnimationFrame(loop); }
  }
  function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    parts.forEach(p=>{
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.vx *= 0.99; p.rot += p.vr; p.life -= p.decay;
      ctx.save(); ctx.globalAlpha = Math.max(0,p.life); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      if (p.emoji){ ctx.font = p.size+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(p.emoji,0,0); }
      else { ctx.fillStyle = p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6); }
      ctx.restore();
    });
    parts = parts.filter(p => p.life > 0 && p.y < canvas.height + 40);
    if (parts.length){ requestAnimationFrame(loop); } else { running = false; ctx.clearRect(0,0,canvas.width,canvas.height); }
  }
})();
</script>
</body>
</html>
